<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 70 450 198" role="img" aria-label="Ratiwal Dream Estates Logo">
  <title>Ratiwal Dream Estates</title>
  <defs>
    <style>
      .brand-bold-white {
        font-family: -apple-system, BlinkMacSystemFont, "Montserrat", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: 1px;
      }
      .brand-sub-white {
        font-family: -apple-system, BlinkMacSystemFont, "Montserrat", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 17.5px;
        letter-spacing: 8.5px;
      }
    </style>
  </defs>

  <!-- Architectural House Roof & Vertical Pillar Lines -->
  <!-- Cyan/Blue Color: #52BDE9 -->
  <g fill="none" stroke="#52BDE9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof Peak -->
    <path d="M 172 135 L 222 84 L 273 135" />
    
    <!-- Vertical Pillar Lines -->
    <!-- Line 1: Leftmost short bar -->
    <line x1="183" y1="145" x2="183" y2="175" />
    <!-- Line 2: Mid-left bar -->
    <line x1="202" y1="114" x2="202" y2="202" />
    <!-- Line 3: Central-left long bar -->
    <line x1="222" y1="94" x2="222" y2="242" />
    <!-- Line 4: Tall protruding bar passing through the roof & between words -->
    <line x1="242" y1="76" x2="242" y2="210" />
    <!-- Line 5: Rightmost short bar -->
    <line x1="262" y1="145" x2="262" y2="175" />
  </g>

  <!-- Brand Typography in Crisp White -->
  <g fill="#FFFFFF">
    <text x="188" y="228" class="brand-bold-white" text-anchor="end">RATIWAL</text>
    <text x="242" y="228" class="brand-bold-white" text-anchor="start">DREAM</text>
    <!-- Bottom Line: E S T A T E S centered -->
    <text x="220" y="258" class="brand-sub-white" text-anchor="middle">ESTATES</text>
  </g>
</svg>
